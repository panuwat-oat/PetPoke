name: PetKit Poll

on:
  schedule:
    # ทุก 15 นาที (GitHub Actions cron มี lag จริง 5-30 นาที)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: petkit-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          PETKIT_USERNAME: ${{ secrets.PETKIT_USERNAME }}
          PETKIT_PASSWORD: ${{ secrets.PETKIT_PASSWORD }}
          PETKIT_REGION: ${{ vars.PETKIT_REGION || 'TH' }}
          PETKIT_TIMEZONE: ${{ vars.PETKIT_TIMEZONE || 'Asia/Bangkok' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_LOG_RAW: ${{ vars.DEBUG_LOG_RAW || 'false' }}
        run: python notifier.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
