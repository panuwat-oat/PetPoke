services:
  petpoke:
    build: .
    image: petpoke:latest
    container_name: petpoke
    env_file: .env
    environment:
      # Poll cadence. Tightened to 5 min on the personal VPS (no free-tier
      # quota to respect, unlike the old Cloud Run */15 schedule).
      POLL_INTERVAL_MINUTES: "5"
      # Local-file state backend lives in the mounted volume below.
      STATE_FILE: /data/state.json
      PETKIT_REGION: TH
      PETKIT_TIMEZONE: Asia/Bangkok
      # Log timestamps in Bangkok local time (needs system tzdata, see Dockerfile).
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
    restart: unless-stopped
    # Cap container logs so json-file can't fill the disk over months of
    # 5-min polling (default driver is unbounded). 10MB x 5 files = 50MB max.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
